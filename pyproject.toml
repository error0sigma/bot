[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-discovery-engine"
version = "0.1.0"
description = "Plugin-based, rate-limited discovery engine for lawful public-source research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
discovery = "discovery_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
